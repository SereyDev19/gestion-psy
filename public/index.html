<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestion Psy</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css?v=15">
  <script src="/theme.js?v=15"></script>
</head>
<body>
  <aside class="side">
    <div class="brand"><img src="/logo-256.png" alt="" width="34" height="34"> <span id="brand-name">Gestion Psy</span></div>
    <button class="searchbtn" id="searchbtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Rechercher<kbd id="kbd">Ctrl K</kbd></button>
    <nav>
      <a href="#/accueil" data-nav="accueil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4.5l8 7M6 10v9.5h4.5v-5h3v5H18V10"/></svg>Accueil</a>
      <a href="#/patients" data-nav="patients"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14c2.6.1 4.5 1.9 4.5 4.5"/></svg>Patients</a>
      <a href="#/consultations" data-nav="consultations"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3.5v3M15 3.5v3"/></svg>Consultations <span class="count" id="day-count" hidden title="Séances aujourd’hui"></span></a>
    </nav>
    <div class="nav-aux">
      <div class="nav-section">Réglages</div>
      <nav class="nav-secondary">
        <a href="#/parametres" data-nav="parametres"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6"/></svg>Paramètres</a>
        <a href="#/modeles" data-nav="modeles"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5H7a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4.5M9 12h6M9 15.5h6"/></svg>Modèles de séance</a>
        <a href="#/doublons" data-nav="doublons"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="11" height="13" rx="2"/><path d="M9.5 6V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/></svg>Doublons <span class="count" id="dbl-count" hidden></span></a>
        <a href="#/corbeille" data-nav="corbeille"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>Corbeille <span class="count" id="trash-count" hidden></span></a>
      </nav>
    </div>
    <div class="side-foot">
      <button class="btn ghost small" id="lockbtn" type="button" hidden>🔒 Verrouiller</button>
      <a class="btn ghost small" href="/api/sauvegarde">Sauvegarder les données</a>
      <p class="muted tiny">Tout reste sur cet ordinateur.</p>
      <p class="muted tiny" id="ver"></p>
    </div>
  </aside>
  <main id="app"></main>
  <div id="modal-root"></div>
  <div id="search-root"></div>
  <div id="lock-root"></div>
  <div id="picker-root"></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/app.js?v=15"></script>
</body>
</html>
